<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetExplorer '99</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "MS Sans Serif", Tahoma, Geneva, sans-serif;
    background: #008080;
    overflow: hidden;
    -webkit-font-smoothing: none;
  }
  body { font-size: 13px; }

  /* ===================== DESKTOP / BOOT ===================== */
  #desktop {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 30% 20%, #1a6e6e 0%, #004444 60%, #002222 100%);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  #desktop.hidden { display: none; }

  .win {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    box-shadow: 1px 1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    padding: 2px;
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font-weight: bold;
    padding: 3px 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px;
  }
  .titlebar .tbtns span {
    display: inline-block; width: 16px; height: 14px;
    background: #c0c0c0; border: 1px solid;
    border-color: #fff #000 #000 #fff;
    text-align: center; line-height: 12px; color: #000; font-size: 10px;
    margin-left: 2px; font-weight: bold;
  }

  /* Dial-up connection dialog */
  #dialup {
    width: 380px;
  }
  #dialup .body { padding: 14px; }
  #dialup .row { margin-bottom: 9px; display:flex; align-items:center; }
  #dialup label { width: 90px; display:inline-block; }
  #dialup input {
    border: 2px solid; border-color:#808080 #fff #fff #808080;
    background:#fff; padding:2px 4px; flex:1; font-family:inherit; font-size:12px;
  }
  .btn {
    background:#c0c0c0; border:2px solid;
    border-color:#fff #000 #000 #fff;
    padding:4px 14px; font-family:inherit; font-size:12px;
    cursor:pointer; min-width:75px;
  }
  .btn:active { border-color:#000 #fff #fff #000; }
  .modem-icon {
    width:48px; height:40px;
    margin: 0 auto 10px; display:block;
    image-rendering: pixelated;
  }
  #dialStatus {
    font-size:12px; margin-top:8px; min-height:18px; color:#000;
  }
  .progress-outer {
    border:2px solid; border-color:#808080 #fff #fff #808080;
    background:#fff; height:18px; margin-top:8px; padding:2px; display:none;
  }
  .progress-inner {
    height:100%; width:0%;
    background: repeating-linear-gradient(90deg,#000080 0,#000080 10px,#1084d0 10px,#1084d0 12px);
  }
  .btnrow { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }

  /* ===================== BROWSER CHROME ===================== */
  #browser {
    position: fixed; inset: 0; display:none; flex-direction:column;
    background:#c0c0c0;
  }
  #browser.show { display:flex; }
  .menubar {
    background:#c0c0c0; padding:3px 4px; font-size:12px;
    border-bottom:1px solid #808080;
    display:flex; align-items:center; gap:2px;
  }
  .menubar .brand { font-weight:bold; color:#000080; margin-right:10px; padding-left:4px;}
  .menubar .mitem { padding:2px 8px; cursor:default; }
  .menubar .mitem:hover { background:#000080; color:#fff; }
  .menubar .nlogo {
    margin-left:auto; font-weight:bold; color:#fff;
    background:#000080; padding:2px 8px; font-style:italic;
    font-size:11px;
  }

  .toolbar {
    background:#c0c0c0; padding:4px 4px; display:flex; align-items:center; gap:3px;
    border-bottom:1px solid #808080;
  }
  .tbtn {
    background:#c0c0c0; border:2px solid; border-color:#fff #808080 #808080 #fff;
    padding:3px 6px; cursor:pointer; font-size:11px;
    display:flex; flex-direction:column; align-items:center; min-width:46px;
    color:#000;
  }
  .tbtn:hover { border-color:#fff #404040 #404040 #fff; background:#cacaca; }
  .tbtn:active { border-color:#808080 #fff #fff #808080; }
  .tbtn[disabled] { color:#808080; cursor:default; }
  .tbtn .ico { font-size:16px; line-height:16px; }
  .tbtn .lbl { font-size:10px; }
  .tbsep { width:2px; height:32px; background:#808080; margin:0 3px;
           border-right:1px solid #fff; }

  .addrbar {
    background:#c0c0c0; padding:4px 6px; display:flex; align-items:center; gap:6px;
    border-bottom:2px solid #808080;
  }
  .addrbar label { font-size:12px; }
  #address {
    flex:1; border:2px solid; border-color:#808080 #fff #fff #808080;
    background:#fff; padding:3px 6px; font-family:inherit; font-size:12px;
  }
  #goBtn { padding:3px 12px; }

  /* viewport */
  #viewport {
    flex:1; overflow:auto; background:#fff; position:relative;
  }
  #pageFrame { width:100%; min-height:100%; }

  /* status bar */
  .statusbar {
    background:#c0c0c0; border-top:1px solid #fff;
    display:flex; align-items:center; height:22px; font-size:11px;
  }
  .statusbar .seg {
    border:1px solid; border-color:#808080 #fff #fff #808080;
    height:18px; margin:2px; padding:0 8px; display:flex; align-items:center;
    overflow:hidden; white-space:nowrap;
  }
  .statusbar .doc { width:130px; }
  .statusbar .msg { flex:1; }
  .statusbar .secure { width:24px; justify-content:center; }
  .sb-progress {
    width:160px; padding:2px;
  }
  .sb-progress .bar {
    height:12px; width:0%;
    background:repeating-linear-gradient(90deg,#000080 0,#000080 6px,#1084d0 6px,#1084d0 8px);
    transition:width 0.05s linear;
  }

  /* loading throbber (N) */
  .throbber {
    width:18px; height:18px; margin-right:8px;
    background:#000080; color:#fff; font-weight:bold; font-style:italic;
    text-align:center; line-height:18px; font-size:12px;
  }
  .throbber.spin { animation: blinkN 0.4s steps(2) infinite; }
  @keyframes blinkN { 50% { background:#1084d0; } }

  /* ===================== AIM CHAT ===================== */
  #aim {
    position:fixed; bottom:6px; right:6px; width:230px; z-index:60;
    display:none;
  }
  #aim.show { display:block; }
  #aim .body { padding:0; background:#c0c0c0; }
  #aimLog {
    height:150px; background:#fff; border:2px solid;
    border-color:#808080 #fff #fff #808080; margin:4px; padding:4px;
    overflow-y:auto; font-size:11px; line-height:1.35;
  }
  #aimLog .me { color:#cc0000; font-weight:bold; }
  #aimLog .them { color:#0000cc; font-weight:bold; }
  #aimInputRow { display:flex; gap:4px; margin:0 4px 4px; }
  #aimInput {
    flex:1; border:2px solid; border-color:#808080 #fff #fff #808080;
    padding:2px 4px; font-family:inherit; font-size:11px;
  }
  #aim .titlebar { background:linear-gradient(90deg,#5c0099,#9933cc); }
  .aim-online { font-size:10px; padding:2px 6px; color:#006600; }

  /* AIM minimized launcher */
  #aimLauncher {
    position:fixed; bottom:6px; right:6px; z-index:59;
    background:#5c0099; color:#fff; padding:6px 10px; cursor:pointer;
    border:2px solid; border-color:#fff #000 #000 #fff; font-weight:bold;
    font-size:12px; display:none;
  }
  #aimLauncher.show { display:block; }
  #aimLauncher.buzz { animation: buzz 0.15s linear 6; }
  @keyframes buzz { 0%{transform:translate(0,0)} 25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-1px)} 75%{transform:translate(-1px,-1px)} }

  /* ===================== IN-PAGE STYLES (sandbox via class scope) ===================== */
  /* All page content gets .page99 wrapper; styles below only apply inside it */

  .page99 { font-family:"Times New Roman", Times, serif; }
  .page99 a { text-decoration:underline; cursor:pointer; }
  .page99 img.uc { image-rendering:pixelated; }
  .page99 .comic { font-family:"Comic Sans MS","Comic Sans",cursive; }
  .page99 blink { animation: blinker 1s steps(2) infinite; }
  @keyframes blinker { 50% { opacity:0; } }
  .page99 marquee, .page99 .marq {
    overflow:hidden; white-space:nowrap;
  }
  .page99 .marq span { display:inline-block; padding-left:100%;
    animation: marq 12s linear infinite; }
  @keyframes marq { 0%{transform:translate(0)} 100%{transform:translate(-200%)} }
  .page99 hr { height:4px; border:0; }
  .page99 .btn88 {
    display:inline-block; width:88px; height:31px; line-height:31px;
    text-align:center; font-size:9px; font-family:"MS Sans Serif",sans-serif;
    color:#fff; border:1px outset #888; margin:2px; vertical-align:middle;
    text-decoration:none; overflow:hidden;
  }
  .page99 .counter {
    display:inline-block; background:#000; color:#0f0;
    font-family:"Courier New",monospace; padding:2px 4px;
    letter-spacing:2px; border:2px ridge #444;
  }
  .page99 .midi-toggle {
    font-family:"MS Sans Serif",sans-serif; font-size:11px;
    background:#c0c0c0; border:2px outset #fff; padding:3px 8px; cursor:pointer;
  }
  .page99 table.layout { border-collapse:collapse; }
  .page99 .guestbook-entry {
    border-bottom:1px dashed #888; padding:4px 0; font-size:13px;
  }
  .page99 .gb-input, .page99 .gb-area, .page99 .search-input {
    font-family:"Times New Roman",serif; font-size:13px;
    border:2px inset #ccc; padding:2px;
  }
  .page99 .gb-btn, .page99 .search-btn {
    font-family:"MS Sans Serif",sans-serif; font-size:11px;
    background:#c0c0c0; border:2px outset #fff; padding:3px 10px; cursor:pointer;
  }
  .page99 .webring {
    border:3px ridge #cc9900; background:#ffffcc; padding:8px; margin:14px 0;
    font-family:"MS Sans Serif",sans-serif; font-size:11px; text-align:center;
  }
  .page99 .ucbar {
    background:repeating-linear-gradient(45deg,#ffcc00 0 12px,#000 12px 24px);
    height:14px; margin:6px 0;
  }
  .page99 .nav404 { text-align:center; padding:40px; }

  /* directory portal */
  .portal-cat {
    border:1px solid #000080; background:#f0f0ff; padding:6px; margin:4px;
    vertical-align:top; width:240px;
  }
  .portal-cat h3 { margin:0 0 4px; color:#990000; font-size:14px; }
  .portal-cat a { font-size:12px; color:#0000cc; }

  /* search results */
  .sr { margin:10px 0; }
  .sr .title { color:#0000cc; font-size:14px; text-decoration:underline; cursor:pointer; }
  .sr .url { color:#008000; font-size:11px; }
  .sr .desc { font-size:12px; color:#333; }

  /* scrollbars retro-ish */
  #viewport::-webkit-scrollbar { width:16px; height:16px; }
  #viewport::-webkit-scrollbar-track { background:#c0c0c0; }
  #viewport::-webkit-scrollbar-thumb { background:#c0c0c0; border:2px outset #fff; }

  .blackscreen {
    position:fixed; inset:0; background:#000; z-index:200; display:none;
    color:#0f0; font-family:"Courier New",monospace; padding:30px;
    font-size:14px; white-space:pre; line-height:1.5;
  }
</style>

<script>
"use strict";

/* ============================================================
   WEB AUDIO: modem screech + MIDI-ish loops, no external files
   ============================================================ */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
let soundOn = true;

function modemHandshake(){
  const ctx = audio(); if(!ctx || !soundOn) return Promise.resolve();
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.value = 0.10;
  master.connect(ctx.destination);

  function tone(freq, start, dur, type){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, now+start);
    g.gain.exponentialRampToValueAtTime(0.9, now+start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+start+dur);
    o.connect(g); g.connect(master);
    o.start(now+start); o.stop(now+start+dur+0.05);
  }
  function noise(start, dur, vol){
    const len = Math.floor(ctx.sampleRate*dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = vol||0.4;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(now+start); src.stop(now+start+dur);
  }
  // DTMF-ish dialing
  [697,770,852,941,697].forEach((f,i)=>{ tone(f,i*0.18,0.14,'sine'); tone(1336,i*0.18,0.14,'sine'); });
  // ring
  tone(440,1.0,0.4,'sine'); tone(480,1.0,0.4,'sine');
  tone(440,1.7,0.4,'sine'); tone(480,1.7,0.4,'sine');
  // handshake screech
  tone(1100,2.5,0.5,'square');
  tone(2100,3.0,0.8,'sawtooth');
  noise(3.2,1.2,0.35);
  tone(1300,3.4,0.6,'square');
  tone(2300,4.0,1.0,'sawtooth');
  noise(4.0,1.5,0.45);
  tone(900,5.2,0.4,'square');
  return new Promise(r=>setTimeout(r, 100));
}

/* MIDI-style looping music per page using oscillators */
let midiNodes = null, midiPlaying = false;
const SCALES = {
  cheery:  [523,587,659,698,784,659,587,523, 587,659,523,440],
  spooky:  [330,311,330,392,330,311,247,294, 330,311,277,247],
  rock:    [220,220,330,294,220,220,196,220, 330,330,392,330],
  dreamy:  [392,440,494,587,494,440,392,330, 440,494,523,440]
};
function startMidi(scaleName){
  stopMidi();
  const ctx = audio(); if(!ctx||!soundOn) return;
  midiPlaying = true;
  const seq = SCALES[scaleName]||SCALES.cheery;
  const master = ctx.createGain(); master.gain.value = 0.05;
  master.connect(ctx.destination);
  let i = 0;
  const tempo = 230;
  const timer = setInterval(()=>{
    if(!midiPlaying){ clearInterval(timer); return; }
    const f = seq[i % seq.length]; i++;
    const o = ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.8,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+tempo/1000*0.9);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+tempo/1000);
    // bass every 4
    if(i%4===0){
      const b = ctx.createOscillator(); b.type='sine'; b.frequency.value=f/2;
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0.0001,t); bg.gain.linearRampToValueAtTime(0.6,t+0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001,t+tempo/1000*1.8);
      b.connect(bg); bg.connect(master); b.start(t); b.stop(t+tempo/1000*2);
    }
  }, tempo);
  midiNodes = { master, timer };
}
function stopMidi(){
  midiPlaying = false;
  if(midiNodes){ try{ midiNodes.master.disconnect(); }catch(e){} clearInterval(midiNodes.timer); midiNodes=null; }
}

/* ============================================================
   Draw a tiny pixel modem icon on canvas (no external img)
   ============================================================ */
(function drawModem(){
  const c = document.getElementById('modemCanvas');
  const x = c.getContext('2d');
  x.fillStyle='#888'; x.fillRect(2,14,44,22);
  x.fillStyle='#bbb'; x.fillRect(4,16,40,14);
  x.fillStyle='#0f0'; x.fillRect(8,20,3,3);
  x.fillStyle='#f00'; x.fillRect(14,20,3,3);
  x.fillStyle='#ff0'; x.fillRect(20,20,3,3);
  x.fillStyle='#666'; x.fillRect(2,32,44,4);
  x.fillStyle='#444'; x.fillRect(20,2,8,12);
})();

/* ============================================================
   SESSION STORAGE: guestbooks + counters
   ============================================================ */
const SESSION = {
  guestbooks: {},
  counters: {},
};
function gbKey(p){ return p; }
function getGuestbook(p){ if(!SESSION.guestbooks[p]) SESSION.guestbooks[p]=[]; return SESSION.guestbooks[p]; }
function getCounter(p, base){
  if(SESSION.counters[p]===undefined) SESSION.counters[p] = base + Math.floor(Math.random()*40);
  SESSION.counters[p]++;
  return SESSION.counters[p];
}

/* ============================================================
   THE WEB — all in-world pages (12+ interlinked)
   Each page = { title, url, midi, render(ctx) -> html string }
   ============================================================ */

const RING_ORDER = [
  'geocities/dragoncave','geocities/spice','geocities/xfiles',
  'geocities/pixelpalace','geocities/y2kbunker','geocities/catlady',
  'geocities/skater','geocities/poetry'
];

function ringNav(slug, ringName){
  const idx = RING_ORDER.indexOf(slug);
  const prev = RING_ORDER[(idx-1+RING_ORDER.length)%RING_ORDER.length];
  const next = RING_ORDER[(idx+1)%RING_ORDER.length];
  const rnd = RING_ORDER[Math.floor(Math.random()*RING_ORDER.length)];
  return `<div class="webring">
    <b>~*~ ${ringName} WebRing ~*~</b><br>
    <a data-nav="${prev}">[ &lt;&lt; Prev ]</a>
    <a data-nav="${RING_ORDER[0]}">[ List ]</a>
    <a data-nav="${rnd}">[ ? Random ]</a>
    <a data-nav="${next}">[ Next &gt;&gt; ]</a><br>
    <small>This site is part of the ${ringName} ring. Member #${(idx+1)} of ${RING_ORDER.length}.</small>
  </div>`;
}

function counterHTML(slug, base){
  const n = getCounter(slug, base);
  const s = String(n).padStart(6,'0');
  return `<span class="counter" title="Visitor count">${s.split('').join(' ')}</span>`;
}

function ucGif(){
  return `<div style="text-align:center;margin:6px 0">
    <span class="comic" style="background:#ffff00;color:#cc0000;padding:2px 6px;border:2px dashed #cc0000;font-weight:bold;">
      🚧 UNDER CONSTRUCTION 🚧</span>
    <div class="ucbar"></div>

function guestbookHTML(slug){

  return `<div style="border:3px double #000080;background:#fffff0;padding:10px;margin:12px 0">

}

/* page wrapper helper (tiled background + base colors) */
function pageWrap(bg, fg, inner){
  // tiled "background image" simulated with a CSS repeating pattern
  const tile = `repeating-conic-gradient(${bg} 0% 25%, ${shade(bg,12)} 0% 50%)`;
  return `<div style="background:${bg};background-image:${tile};background-size:24px 24px;color:${fg};min-height:90%;padding:14px">${inner}</div>`;
}
function shade(hex, amt){
  // crude lighten for hex like #1a0033
  if(!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amt); g=Math.min(255,g+amt); b=Math.min(255,b+amt);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function doSearch(q){
  const query = q.toLowerCase().trim();
  if(!query) return [];
  const terms = query.split(/\s+/);
  const scored = SEARCH_INDEX.map(item=>{
    let score = 0;
    const hay = (item.title+' '+item.desc+' '+item.kw.join(' ')).toLowerCase();
    terms.forEach(t=>{
      item.kw.forEach(k=>{ if(k===query) score+=10; });
      if(hay.includes(t)) score += 3;
      if(item.kw.some(k=>k.includes(t))) score += 2;
    });
    return { ...item, score };
  }).filter(i=>i.score>0).sort((a,b)=>b.score-a.score);
  return scored;
}

/* ============================================================
   BROWSER ENGINE — history, navigation, status bar simulation
   ============================================================ */
const browser = {
  history: [],
  pos: -1,
  current: null,
  loadingTimer: null,
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseSlug(target){
  // target may be "search?q=ufo"
  let slug = target, query=null;
  const qi = target.indexOf('?');
  if(qi>=0){
    slug = target.slice(0,qi);
    const params = new URLSearchParams(target.slice(qi+1));
    query = params.get('q')||'';
  }
  return { slug, query };
}

function resolvePage(slug){
  if(slug==='' || slug==='home') return 'home';
  if(PAGES[slug]) return slug;
  return null;
}

function navigate(target, pushHistory=true){
  const { slug, query } = parseSlug(target);
  const resolved = resolvePage(slug);
  const ctx = { query, url:target };

  // begin loading
  beginLoading();

  const pageKey = resolved || '404';
  const loadTime = 500 + Math.floor(Math.random()*1200); // simulate 56k

  // schedule render after fake load
  browser.loadingTimer = setTimeout(()=>{
    finishLoad(pageKey, ctx, target, pushHistory);
  }, loadTime);

  // progress animation
  animateProgress(loadTime);
}

let progressTimer=null;
function animateProgress(duration){
  const bar = document.getElementById('sbBar');
  const start = performance.now();
  clearInterval(progressTimer);
  progressTimer = setInterval(()=>{
    const t = (performance.now()-start)/duration;
    if(t>=1){ bar.style.width='100%'; clearInterval(progressTimer); return; }
    bar.style.width = Math.min(98, Math.floor(t*100)) + '%';
  }, 40);
}

function beginLoading(){
  document.getElementById('docStatus').textContent = 'Document: Loading...';
  document.getElementById('statusMsg').textContent = 'Connecting to host...';
  document.getElementById('throbber').classList.add('spin');
  document.getElementById('sbThrob').classList.add('spin');
  document.getElementById('sbBar').style.width='5%';
  document.getElementById('navStop').removeAttribute('disabled');
  // staged status messages
  setTimeout(()=>{ if(browser.loadingTimer) setStatus('Host contacted. Waiting for reply...'); }, 200);
  setTimeout(()=>{ if(browser.loadingTimer) setStatus('Transferring data...'); }, 500);
}
function setStatus(msg){ document.getElementById('statusMsg').textContent = msg; }

function finishLoad(pageKey, ctx, target, pushHistory){
  const page = PAGES[pageKey];
  // stop music from previous page, start this page's
  stopMidi();
  // render
  const frame = document.getElementById('pageFrame');
  frame.innerHTML = page.render(ctx);
  document.getElementById('viewport').scrollTop = 0;

  // address bar + title
  document.title = page.title + ' - NetExplorer';
  const displayUrl = (pageKey==='search' && ctx.query)
      ? page.url + '?q=' + encodeURIComponent(ctx.query)
      : (pageKey==='404' ? (ctx.url.startsWith('http')?ctx.url:'http://'+ctx.url) : page.url);
  document.getElementById('address').value = displayUrl;
  document.getElementById('secureSeg').textContent = '🔓';

  // status bar done
  clearInterval(progressTimer);
  document.getElementById('sbBar').style.width='100%';
  document.getElementById('docStatus').textContent = 'Document: Done';
  document.getElementById('statusMsg').textContent = 'Done';
  document.getElementById('throbber').classList.remove('spin');
  document.getElementById('sbThrob').classList.remove('spin');
  document.getElementById('navStop').setAttribute('disabled','');
  setTimeout(()=>{ document.getElementById('sbBar').style.width='0%'; }, 600);

  // history
  if(pushHistory){
    // trim forward history
    browser.history = browser.history.slice(0, browser.pos+1);
    browser.history.push({ target, pageKey });
    browser.pos = browser.history.length-1;
  }
  browser.current = { target, pageKey };
  browser.loadingTimer = null;

  // start page midi
  if(page.midi && soundOn){ startMidi(page.midi); }

  // wire page-specific interactivity
  wirePageEvents(pageKey, ctx);
  updateNavButtons();
}

function updateNavButtons(){
  const back = document.getElementById('navBack');
  const fwd = document.getElementById('navFwd');
  if(browser.pos>0) back.removeAttribute('disabled'); else back.setAttribute('disabled','');
  if(browser.pos < browser.history.length-1) fwd.removeAttribute('disabled'); else fwd.setAttribute('disabled','');
}

function goBack(){
  if(browser.pos<=0) return;
  browser.pos--;
  const h = browser.history[browser.pos];
  navigate(h.target, false);
}
function goForward(){
  if(browser.pos>=browser.history.length-1) return;
  browser.pos++;
  const h = browser.history[browser.pos];
  navigate(h.target, false);
}
function stopLoading(){
  if(browser.loadingTimer){ clearTimeout(browser.loadingTimer); browser.loadingTimer=null; }
  clearInterval(progressTimer);
  document.getElementById('throbber').classList.remove('spin');
  document.getElementById('sbThrob').classList.remove('spin');
  document.getElementById('docStatus').textContent = 'Document: Stopped';
  document.getElementById('statusMsg').textContent = 'Stopped';
  document.getElementById('sbBar').style.width='0%';
  document.getElementById('navStop').setAttribute('disabled','');
}

/* ============================================================
   PAGE-SPECIFIC EVENT WIRING (delegated where possible)
   ============================================================ */
function wirePageEvents(pageKey, ctx){
  const frame = document.getElementById('pageFrame');

  // status bar URL preview on link hover (Netscape feel)
  frame.querySelectorAll('[data-nav]').forEach(a=>{
    a.addEventListener('mouseenter', ()=>{
      const t = a.getAttribute('data-nav');
      const { slug } = parseSlug(t);
      const p = PAGES[resolvePage(slug)] || null;
      setStatus(p ? p.url : 'http://www.geocities.geo/'+slug);
    });
    a.addEventListener('mouseleave', ()=>{ if(!browser.loadingTimer) setStatus('Done'); });
  });

  // search box on homepage
  const sb = document.getElementById('searchBox');
  const sg = document.getElementById('searchGo');
  if(sb && sg){
    const run = ()=> navigate('search?q='+encodeURIComponent(sb.value));
    sg.addEventListener('click', run);
    sb.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  }
  const sb2 = document.getElementById('searchBox2');
  const sg2 = document.getElementById('searchGo2');
  if(sb2 && sg2){
    const run = ()=> navigate('search?q='+encodeURIComponent(sb2.value));
    sg2.addEventListener('click', run);
    sb2.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  }

  // guestbook sign buttons
  frame.querySelectorAll('[data-gb]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const slug = btn.getAttribute('data-gb');
      const name = (document.getElementById('gbName')||{}).value || '';
      const from = (document.getElementById('gbFrom')||{}).value || '';
      const msg  = (document.getElementById('gbMsg')||{}).value || '';
      if(!name.trim() || !msg.trim()){ alert('Please enter a name and a message!'); return; }
      getGuestbook(slug).push({ name:name.trim(), from:from.trim()||'the Net', msg:msg.trim(), date:'12/31/1999' });
      // re-render guestbook in place
      const page = PAGES[slug];
      document.getElementById('pageFrame').innerHTML = page.render(ctx);
      wirePageEvents(slug, ctx);
      // scroll to guestbook
      const gb = document.getElementById('gbEntries');
      if(gb) gb.scrollIntoView({block:'center'});
    });
  });

  // midi toggle
  frame.querySelectorAll('[data-midi]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const state = btn.querySelector('.midi-state');
      if(midiPlaying){ stopMidi(); if(state) state.textContent='STOPPED'; }
      else { startMidi(btn.getAttribute('data-midi')); if(state) state.textContent='PLAYING'; }
    });
  });

  // mail rows
  frame.querySelectorAll('[data-mail]').forEach(row=>{
    row.addEventListener('click', ()=>{

      const v = ircInput.value.trim(); if(!v) return;

      log.appendChild(d); log.scrollTop = log.scrollHeight; ircInput.value='';
      setTimeout(()=>{
        const replies=['lol nice','a/s/l?','same tbh','brb phone','any1 got napster?','rofl','y2k is gonna be wild','cool site bro'];
        const r=document.createElement('div');

        log.appendChild(r); log.scrollTop=log.scrollHeight;
      }, 900+Math.random()*1200);
    };
    ircSend.addEventListener('click', send);
    ircInput.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  }
}

function goAddress(){
  let v = document.getElementById('address').value.trim();
  // map known in-world URLs back to slugs
  const found = Object.keys(PAGES).find(k=> PAGES[k].url && (PAGES[k].url===v || PAGES[k].url===v+'/' || PAGES[k].url+'/'===v));
  if(found){ navigate(found); return; }
  if(/netcentral/i.test(v) || v==='' || /^http:\/\/(www\.)?$/.test(v)){ navigate('home'); return; }
  // unknown → 404
  navigate(v, true);
}

let aimStep = 0;
function aimAppend(who, cls, text){
  const log = document.getElementById('aimLog');
  const d = document.createElement('div');
  d.innerHTML = `<span class="${cls}">${who}:</span> ${escapeHtml(text)}`;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function aimBotMsg(){
  if(aimStep>=AIM_BOT.length) return;
  aimAppend('xXxModemRiderxXx','them', AIM_BOT[aimStep]);
  aimStep++;
  buzzLauncher();
  if(aimStep<AIM_BOT.length){
    setTimeout(aimBotMsg, 14000 + Math.random()*9000);
  }
}
function buzzLauncher(){
  const l = document.getElementById('aimLauncher');
  if(l.classList.contains('show')){
    l.classList.add('buzz');
    setTimeout(()=>l.classList.remove('buzz'), 1000);
    // play a little AIM door sound
    aimDoorSound();
  }
}
function aimDoorSound(){
  const ctx = audio(); if(!ctx||!soundOn) return;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(900,ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(300,ctx.currentTime+0.12);
  g.gain.setValueAtTime(0.0001,ctx.currentTime);
  g.gain.linearRampToValueAtTime(0.15,ctx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.15);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.16);
}

document.getElementById('connectBtn').addEventListener('click', startConnect);

let connecting=false;
function startConnect(){
  if(connecting) return; connecting=true;
  audio(); // unlock audio context on user gesture
  const btn = document.getElementById('connectBtn');
  btn.setAttribute('disabled',''); btn.style.color='#808080';
  const status = document.getElementById('dialStatus');
  const prog = document.getElementById('dialProg');
  const inner = document.getElementById('dialProgInner');
  prog.style.display='block';

  const steps = [
    ['Dialing 5550-NET-1999...', 6],
    ['Dialing 5550-NET-1999...', 14],
    ['Ring... Ring...', 28],
    ['Modem handshaking...', 45],
    ['Verifying username and password...', 62],
    ['Connecting at 56,000 bps...', 80],
    ['Connected at 53.3 Kbps!', 100],
  ];

  // play modem screech
  modemHandshake();

  let i=0;
  const tick = setInterval(()=>{
    if(i>=steps.length){
      clearInterval(tick);
      status.innerHTML = '<b style="color:#006600">✓ Connected at 53.3 Kbps</b> — Launching NetExplorer...';
      setTimeout(launchBrowser, 1200);
      return;
    }
    status.textContent = steps[i][0];
    inner.style.width = steps[i][1] + '%';
    i++;
  }, 950);
}

function launchBrowser(){
  document.getElementById('desktop').classList.add('hidden');
  document.getElementById('browser').classList.add('show');
  // show AIM launcher
  document.getElementById('aimLauncher').classList.add('show');
  // load homepage
  navigate('home');
  // kick off AIM buddy after a bit
  setTimeout(()=>{ aimBotMsg(); }, 9000);
}

/* allow Enter on dialup to connect */
document.getElementById('dialup').addEventListener('keydown', e=>{ if(e.key==='Enter') startConnect(); });
