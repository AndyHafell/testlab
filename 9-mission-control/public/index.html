<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mission Control — Claude Code</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='6' fill='%2334d399'/%3E%3Ccircle cx='12' cy='12' r='10' fill='none' stroke='%2334d399' stroke-width='1.5' opacity='0.4'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="conn-dot" title="live connection"></span>
      <span class="brand-name">MISSION CONTROL</span>
      <span class="brand-sub">Claude Code fleet</span>
    </div>
    <div class="topbar-right">
      <span class="clock mono" id="clock"></span>
      <button class="btn btn-primary" id="report-btn">⬡ Today's report</button>
    </div>
  </header>

  <section class="stats-row" id="stats"></section>

  <div class="toolbar">
    <div class="chips" id="filter-chips">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="active">Active</button>
      <button class="chip" data-filter="today">Today</button>
    </div>
    <div class="toolbar-meta mono" id="scan-meta"></div>
  </div>

  <main id="fleet" class="fleet"></main>

  <footer class="footer mono">
    reads <span id="projects-dir"></span> · cost estimates use standard API pricing incl. cache write/read
  </footer>

  <!-- Session replay drawer -->
  <div class="overlay hidden" id="replay-overlay">
    <div class="drawer" id="replay-drawer">
      <div class="drawer-head">
        <div class="drawer-titles">
          <div class="drawer-title" id="replay-title"></div>
          <div class="drawer-sub mono" id="replay-sub"></div>
        </div>
        <div class="drawer-actions">
          <span class="live-pill hidden" id="replay-live">● LIVE</span>
          <button class="btn btn-ghost" id="replay-close">✕ close</button>
        </div>
      </div>
      <div class="drawer-statline mono" id="replay-statline"></div>
      <div class="drawer-body" id="replay-body"></div>
    </div>
  </div>

  <!-- Daily report modal -->
  <div class="overlay hidden" id="report-overlay">
    <div class="modal" id="report-modal">
      <div class="modal-head">
        <div class="modal-title">⬡ What did my agents do</div>
        <div class="modal-actions">
          <input type="date" id="report-date" class="date-input mono" />
          <button class="btn btn-ghost" id="report-copy">copy markdown</button>
          <button class="btn btn-ghost" id="report-close">✕</button>
        </div>
      </div>
      <div class="modal-body" id="report-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
